name: Deploy to GitHub Pages (Official)

on:
  push:
    branches:
      - main 

# Permissions required for both artifact upload and deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies ⬇️
        run: npm install

      - name: Run Production Build 🏗️
        # This command runs your Vite build and outputs to ./dist
        run: npm run build
      
      # Step 1: Upload the build output as a deployable artifact
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The contents of the dist folder will be uploaded
          path: './dist'
      
      # Step 2: Deploy the uploaded artifact to GitHub Pages
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4