name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    # Set permissions for the GITHUB_TOKEN to allow writing to contents
    permissions:
      contents: write
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # *** FIX 1: Ensure a deep, fresh clone of the source code (fetch-depth: 0) ***
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # *** FIX 2 (NEW): Purge ALL stale dependency cache before npm install ***
      - name: Purge Node Modules and Cache
        run: |
          rm -rf node_modules
          npm cache clean --force

      - name: Install Dependencies
        run: npm install

      # *** FIX 3: DELETE OLD BUILD ARTIFACTS ***
      - name: Cleanup Old Build Artifacts
        run: rm -rf dist
      
      # Step 5: Run the build command on a clean slate.
      - name: Run Clean Build
        run: npm run build
      
      # Step 6: The final deployment.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          # *** FIX 4: Force a push, bypassing "Everything up-to-date" ***
          force_orphan: true