name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    # Set permissions for the GITHUB_TOKEN to allow writing to contents
    permissions:
      contents: write
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # *** NEW CRITICAL STEP: DELETE OLD BUILD ***
      - name: Cleanup Old Build Artifacts
        run: rm -rf dist
      
      # Step 5: Run the build command on a clean slate.
      - name: Run Clean Build
        run: npm run build
      
      # Step 6: The final deployment.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'